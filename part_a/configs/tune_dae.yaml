# A2: Optuna (TPE) search in the PROXY setting. Selection metric = validation k-NN top-1.
# Proxy: 150 images/class (30k) for 15 epochs. The k-NN monitor uses a 100/class bank during
# training; the final number of every trial uses the full 90k train split as the bank.
# Writes results/best_configs/pretrain_dae.yaml and pretrain_ae.yaml (copy them over configs/).
MODEL_NAME: tune
RUN_NAME: tune_dae
DATASET: tiny_imagenet
TRAIN_PER_CLASS: 150
NUM_EPOCHS: 15
BATCH_SIZE: 256
KNN_BANK_PER_CLASS: 100
N_TRIALS: 30
# The defaults below are trial #0, the starting point for TPE.
CORRUPTION: gaussian
NOISE_LEVEL: 0.2
LATENT_DIM: 256
LEARNING_RATE: 0.001
WEIGHT_DECAY: 0.0001
SEARCH_SPACE:
  corruption: [gaussian, mask, salt_pepper, none]
  noise_level:                    # the range depends on the corruption type (a conditional parameter)
    gaussian: [0.05, 0.5]         # pixel noise std, images in [0, 1]
    mask: [0.1, 0.75]             # share of 8x8 blocks set to 0
    salt_pepper: [0.05, 0.5]      # share of pixels set to 0 or 1
  latent_dim: [64, 128, 256, 512]
  learning_rate: [0.0001, 0.003]  # log-uniform
  weight_decay: [0.000001, 0.01]  # log-uniform
  final_epochs: 40                # NUM_EPOCHS written into the generated full-setting configs
